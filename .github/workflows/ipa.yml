# Builds an unsigned OxydeMap.ipa on a cloud Mac for sideloading (Sideloadly, AltStore).
# No Apple Developer account or secrets needed. Run it from the Actions tab.
name: Sideload IPA

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi -e beta -e rc | sort -V | tail -1)"
          xcodebuild -version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project OxydeMap.xcodeproj -scheme OxydeMap -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | tee xcodebuild.log | xcbeautify || (tail -200 xcodebuild.log; exit 1)
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OxydeMap.app Payload/
          zip -qry OxydeMap.ipa Payload
          ls -lh OxydeMap.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: OxydeMap-ipa
          path: OxydeMap.ipa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: xcodebuild.log
          if-no-files-found: ignore
