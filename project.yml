name: OxydeMap
options:
  bundleIdPrefix: com.oxydemap
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  OxydeCore:
    path: OxydeCore
  # Optional vector engine. Uncomment to link MapLibre (docs/PROVIDERS.md).
  # MapLibre:
  #   url: https://github.com/maplibre/maplibre-gl-native-distribution
  #   from: "6.0.0"
targets:
  OxydeMap:
    type: application
    platform: iOS
    sources:
      - path: OxydeMap
        excludes:
          - "Resources/Info.plist"
          - "Resources/*.entitlements"
          - "Resources/OxydeMap.storekit"
      - path: OxydeMap/Resources/OxydeMap.storekit
        buildPhase: none
    dependencies:
      - package: OxydeCore
      # - package: MapLibre
      - sdk: CarPlay.framework
    settings:
      base:
        INFOPLIST_FILE: OxydeMap/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
  OxydeMapTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OxydeMapTests]
    dependencies:
      - target: OxydeMap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(OX_BUNDLE_ID).tests
  OxydeMapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OxydeMapUITests]
    dependencies:
      - target: OxydeMap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(OX_BUNDLE_ID).uitests
        TEST_TARGET_NAME: OxydeMap
schemes:
  OxydeMap:
    build:
      targets:
        OxydeMap: all
        OxydeMapTests: [test]
        OxydeMapUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: OxydeMap/Resources/OxydeMap.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - OxydeMapTests
        - OxydeMapUITests
        - package: OxydeCore/OxydeCoreTests
    archive:
      config: Release
